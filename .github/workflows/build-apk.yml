name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets for Android WebView
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets
          cp -r dist app/src/main/assets/dist

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_STRING"
          
          # Extract major version number
          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [[ -z "$JAVA_MAJOR" || ! "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi
          
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found major version $JAVA_MAJOR."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be verified on disk."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty (0 bytes)."
            exit 1
          fi
          
          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "ERROR: File does not have .apk extension."
            exit 1
          fi
          
          echo "APK successfully verified at: $TARGET_APK"
          ls -la "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_RELEASE_DIR}/app-debug.apk"
          
          cp "$SOURCE_APK" "$DEST_APK"
          
          if [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "Prepared release asset at: $DEST_APK"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is missing or empty before release creation."
            exit 1
          fi
          
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk. Found: $ASSET_NAME"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build
          
          - **Build:** GitHub Actions Run #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Source Commit:** ${{ github.sha }}
          - **Asset:** \`app-debug.apk\`
          
          > **Note:** This is an automatically generated debug APK built for testing purposes. It is signed with a temporary debug key and is not intended for production or Google Play Store distribution.
          EOF
          )
          
          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE PUBLISHED SUCCESSFULLY ==="
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK Download: $DIRECT_URL"
            
            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the latest debug APK directly here:" >> "$GITHUB_STEP_SUMMARY"
            echo "[**Download app-debug.apk**]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*Actions artifact \`app-debug-apk\` remains preserved as a backup.*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and the Actions artifact 'app-debug-apk' remains available for download."
            else
              echo "APK build or verification encountered an error."
            fi
          fi
